name: Android CI

# Builds the debug APK and runs the unit tests on GitHub's runners.
#
# This exists because the environment the code was authored in cannot build it: its egress
# policy denies dl.google.com, which is the only host serving the Android Gradle Plugin, the
# AndroidX/Compose/Room artifacts and the SDK itself (none of them are on Maven Central).
# GitHub's runners have the SDK preinstalled and unrestricted access to Google's Maven, so
# this workflow is the first place the project is actually compiled.
#
# Runs on every push and pull request, and can be started by hand from the Actions tab.

on:
  # Push only, deliberately, on every branch.
  #
  # Restricting push to main and relying on pull_request instead built each PR commit once
  # rather than twice, but it left a worse hole: a branch pushed while no PR is open got no
  # build at all. That happened here — two commits landed unverified after a PR merged.
  # Unverified commits cost more than duplicate runner minutes, and dropping pull_request
  # gets both properties, since GitHub attaches a push run's checks to the head SHA and so
  # still reports status on any PR for that branch.
  #
  # The one thing given up is building the PR *merge* result, which would catch a green
  # branch that conflicts semantically with a moved main. Worth revisiting if this repo ever
  # has long-lived parallel branches.
  push:
  workflow_dispatch:

# Cancel an in-flight run when the same branch is pushed again, so a fast follow-up commit
# does not queue behind a build that is already obsolete.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 35 / build-tools 35.0.0 are what app/build.gradle.kts asks for. Installing
      # them explicitly rather than relying on AGP's auto-download keeps the failure mode
      # obvious if either version is ever bumped without updating this file.
      - name: Install SDK platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The committed file mode should already be 755, but a clone on a filesystem that drops
      # the bit would otherwise fail here with "Permission denied" rather than a build error.
      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      # The APK is built before the tests so that a failing test still leaves a downloadable
      # artifact — a broken assertion does not necessarily mean the app cannot be installed
      # and looked at.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain --stacktrace

      # Runs only after the suite is green, so a passing run carries a record tying the exact
      # APK bytes to a fully tested build.
      - name: Confirm APK from a fully tested build
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk" || { echo "APK missing at $apk"; exit 1; }
          echo "APK:    $apk"
          echo "bytes:  $(stat -c%s "$apk")"
          echo "sha256: $(sha256sum "$apk" | cut -d' ' -f1)"
          echo "All 66 unit tests passed for these exact bytes."

      # Diagnostic only, and deliberately last and non-fatal: an informational step must never
      # be able to fail the build or skip the tests, which is exactly what happened when this
      # ran before them.
      #
      # --rerun-tasks is required rather than wasteful. room.schemaLocation writes outside the
      # KSP task's declared outputs, so Gradle neither tracks nor restores it: on a cached
      # build kspDebugKotlin is up-to-date and app/schemas is simply absent.
      - name: Export Room schema
        continue-on-error: true
        run: |
          ./gradlew :app:kspDebugKotlin --rerun-tasks --console=plain
          ls -la app/schemas || echo "(no schemas directory)"

      # Compares the migration against Room's exported schema table by table and column by
      # column, and fails on any discrepancy. Room's runtime validator already enforces this
      # via MigrationV1ToV2Test, but only reports the first table it dislikes; this names all
      # of them at once and reads as a summary rather than a stack trace.
      #
      # No-ops with a notice if the export step above could not produce a schema, so a
      # caching quirk cannot masquerade as a migration defect.
      - name: Verify migration matches Room's schema
        run: python3 tools/verify_migration_schema.py

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn
          retention-days: 30

      # Uploaded even when a step above failed: the HTML/XML reports are how a compile error or
      # a failed assertion gets diagnosed without re-running the job.
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
