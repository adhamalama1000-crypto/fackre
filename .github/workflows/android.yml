name: Android CI

# Builds the debug APK and runs the full unit-test suite from a clean state.
#
# This exists because the environment the code is authored in cannot build it: its egress
# policy denies dl.google.com, which is the only host serving the Android Gradle Plugin, the
# AndroidX/Compose/Room artifacts and the SDK itself (none are published to Maven Central).
# GitHub's runners have the SDK and unrestricted access to Google's Maven, so this workflow is
# where the project is actually compiled and tested.
#
# Every step fails closed. There is deliberately no `continue-on-error` anywhere: a step that
# cannot do its job must fail the run rather than report success, which is why the schema
# verifier exits non-zero when it finds no schema to compare instead of passing vacuously.

on:
  # Push only, deliberately, on every branch.
  #
  # Restricting push to main and relying on pull_request instead built each PR commit once
  # rather than twice, but it left a worse hole: a branch pushed while no PR is open got no
  # build at all. That happened here — two commits landed unverified after a PR merged.
  # Unverified commits cost more than duplicate runner minutes, and dropping pull_request
  # gets both properties, since GitHub attaches a push run's checks to the head SHA and so
  # still reports status on any PR for that branch.
  #
  # The one thing given up is building the PR *merge* result, which would catch a green
  # branch that conflicts semantically with a moved main. Worth revisiting if this repo ever
  # has long-lived parallel branches.
  push:
  workflow_dispatch:
    inputs:
      cold:
        description: >-
          Disable the Gradle cache so everything is compiled from source. `clean` alone only
          empties the output directory; the build cache then repopulates it, which can turn
          assembleDebug into an 11-second no-op that proves the task graph runs but not that
          the code still compiles.
        type: boolean
        default: false

# Cancel an in-flight run when the same branch is pushed again, so a fast follow-up commit
# does not queue behind a build that is already obsolete.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 35 / build-tools 35.0.0 are what app/build.gradle.kts asks for. Installing
      # them explicitly rather than relying on AGP's auto-download keeps the failure mode
      # obvious if either version is ever bumped without updating this file.
      - name: Install SDK platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: ${{ github.event.inputs.cold == 'true' }}

      # The committed file mode should already be 755, but a clone on a filesystem that drops
      # the bit would otherwise fail here with "Permission denied" rather than a build error.
      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Report toolchain versions
        run: |
          java -version
          ./gradlew --version --console=plain
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Clean
        run: ./gradlew clean --console=plain

      # The APK is built before the tests so that a failing test still leaves a downloadable
      # artifact — a broken assertion does not necessarily mean the app cannot be installed
      # and looked at. The run still fails if the suite fails.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace --console=plain

      # Proves an APK was really produced rather than that a path exists: an empty or truncated
      # file passes a bare `test -f`, so the archive is opened and required to contain both a
      # dex and a manifest.
      - name: Verify the APK is a real APK
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk" || { echo "FAIL: no APK at $apk"; exit 1; }
          bytes=$(stat -c%s "$apk")
          echo "APK:    $apk"
          echo "bytes:  $bytes"
          echo "sha256: $(sha256sum "$apk" | cut -d' ' -f1)"
          test "$bytes" -gt 1000000 || { echo "FAIL: APK implausibly small"; exit 1; }
          unzip -l "$apk" | grep -q 'classes.dex' || { echo "FAIL: no classes.dex in APK"; exit 1; }
          unzip -l "$apk" | grep -q 'AndroidManifest.xml' || { echo "FAIL: no manifest in APK"; exit 1; }
          echo "APK contains classes.dex and AndroidManifest.xml."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --console=plain

      # Room writes the exported schema during KSP. --rerun-tasks is required rather than
      # wasteful: room.schemaLocation writes outside the KSP task's declared outputs, so Gradle
      # neither tracks nor restores it, and a cache-restored KSP task leaves app/schemas empty
      # even after a clean. Fatal, because the verifier below is useless without it — an earlier
      # revision made this non-fatal and the verifier then "passed" having compared nothing.
      # Gradle prints no summary when a suite passes, so the only measured test count comes
      # from the JUnit XML. Reported here rather than asserted from a source-tree grep, and
      # fatal on a zero count or any skip: a suite that ran nothing, or that quietly disabled
      # cases, must not read as a pass.
      - name: Summarise test results
        run: |
          python3 - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob("app/build/test-results/testDebugUnitTest/*.xml")
          if not files:
              print("FAIL: no JUnit XML under app/build/test-results/testDebugUnitTest")
              sys.exit(1)
          total = fail = err = skip = 0
          per_suite = []
          for f in files:
              r = ET.parse(f).getroot()
              t = int(r.get("tests", 0)); fl = int(r.get("failures", 0))
              e = int(r.get("errors", 0)); sk = int(r.get("skipped", 0))
              total += t; fail += fl; err += e; skip += sk
              per_suite.append((r.get("name", f), t, fl, e, sk))
          for name, t, fl, e, sk in sorted(per_suite):
              print(f"  {name:70s} {t:3d} tests  {fl} failed  {e} errors  {sk} skipped")
          print(f"TOTAL: {total} tests, {fail} failed, {err} errors, {skip} skipped")
          if total == 0:
              print("FAIL: the suite reported zero tests"); sys.exit(1)
          if fail or err:
              print("FAIL: failing tests"); sys.exit(1)
          if skip:
              print("FAIL: tests were skipped; the suite must not disable cases"); sys.exit(1)
          print(f"PASS: {total}/{total} tests passed, none skipped.")
          EOF

      - name: Export Room schema
        run: |
          ./gradlew :app:kspDebugKotlin --rerun-tasks --console=plain
          find app/schemas -type f -name '*.json' -print

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: error
          retention-days: 30

      # Uploaded even when a step above failed: the HTML/XML reports are how a compile error or
      # a failed assertion gets diagnosed without re-running the job.
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      # Deliberately the final step. It is still fatal — the run fails on any discrepancy or
      # if no schema can be found — but running last puts its table at the end of the log,
      # where it can be read without hunting through artifact-upload chatter.
      #
      # Compares columns, affinities, nullability, defaults, primary keys, indices and foreign
      # keys against Room's exported schema. Room's runtime validator enforces the same thing
      # via MigrationV1ToV2Test, but reports only the first table it rejects; this names every
      # discrepancy at once.
      - name: Verify migration against Room's exported schema
        run: python3 tools/verify_migration_schema.py
